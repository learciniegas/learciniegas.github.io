<!doctype html>
<html lang="es-EC">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Catálogo de periféricos</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-p="cat">
    <main id="main">
      <h1>Catálogo de periféricos</h1>
      <p class="lead">Encuentra lo que necesitas y compara precios antes de comprar.</p>
      <div class="lay">
        <aside class="f" aria-label="Filtros">
          <h2>Filtrar productos</h2>
          <form method="get" id="sf">
            <input type="hidden" name="q" id="hq" />
            <fieldset>
              <legend>Categoría</legend>
              <label class="o"><input type="radio" name="cat" value="" checked /> Todas</label
              ><label class="o"><input type="radio" name="cat" value="Teclados" /> Teclados</label
              ><label class="o"><input type="radio" name="cat" value="Ratones" /> Ratones</label
              ><label class="o"
                ><input type="radio" name="cat" value="Audífonos" /> Audífonos</label
              >
            </fieldset>
            <fieldset>
              <legend>Precio en USD</legend>
              <label for="min">Desde</label
              ><input id="min" name="min" type="number" min="0" placeholder="$20" /><label
                for="max"
                style="margin-top: 0.6rem"
                >Hasta</label
              ><input id="max" name="max" type="number" min="0" placeholder="$100" /><label
                class="o"
                ><input type="checkbox" name="stock" value="1" id="stk" /> Solo en stock</label
              >
            </fieldset>
            <button class="btn pri w">Aplicar filtros</button>
            <p><a class="btn w" href="index.html">Limpiar filtros</a></p>
          </form>
        </aside>
        <div>
          <div class="tb">
            <div id="chips" aria-label="Filtros activos"></div>
            <div>
              <label for="ord">Orden</label
              ><select id="ord" name="ord" form="sf" onchange="this.form.requestSubmit()">
                <option value="">Relevancia</option>
                <option value="asc">Precio: menor a mayor</option>
                <option value="desc">Precio: mayor a menor</option>
              </select>
            </div>
          </div>
          <p id="cnt" aria-live="polite"></p>
          <div id="res"></div>
        </div>
      </div>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
